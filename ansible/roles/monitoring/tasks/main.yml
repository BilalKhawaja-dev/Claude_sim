---
# Deploy kube-prometheus-stack and configure Grafana dashboards

- name: Create monitoring namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: monitoring
    state: present

- name: Deploy kube-prometheus-stack Helm chart
  kubernetes.core.helm:
    name: monitoring
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    create_namespace: true
    values_files:
      - "{{ playbook_dir }}/../../k8s/monitoring/values.yaml"
    wait: true
    wait_timeout: "600s"

- name: Read backend-api dashboard
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../../k8s/monitoring/dashboards/backend-api.json"
  register: dashboard_backend_api

- name: Read cluster-health dashboard
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../../k8s/monitoring/dashboards/cluster-health.json"
  register: dashboard_cluster_health

- name: Read rds-performance dashboard
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/../../k8s/monitoring/dashboards/rds-performance.json"
  register: dashboard_rds_performance

- name: Create Grafana dashboards ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-dashboards-claude-simulator
        namespace: monitoring
        labels:
          grafana_dashboard: "1"
      data:
        backend-api.json: "{{ dashboard_backend_api.content | b64decode }}"
        cluster-health.json: "{{ dashboard_cluster_health.content | b64decode }}"
        rds-performance.json: "{{ dashboard_rds_performance.content | b64decode }}"
