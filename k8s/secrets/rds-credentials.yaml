# RDS PostgreSQL credentials for the backend application.
# Replace placeholder values before applying. Do NOT commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: rds-credentials
  namespace: claude-simulator
type: Opaque
stringData:
  host: "REPLACE_WITH_RDS_ENDPOINT"       # e.g. claude-sim.xxxx.us-east-1.rds.amazonaws.com
  port: "5432"
  database: "claude_simulator"
  username: "REPLACE_WITH_DB_USERNAME"
  password: "REPLACE_WITH_DB_PASSWORD"
