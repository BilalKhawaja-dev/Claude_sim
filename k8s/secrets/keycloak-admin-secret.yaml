# Keycloak admin console password.
# Referenced by bitnami/keycloak Helm chart via auth.existingSecret.
# Replace placeholder value before applying. Do NOT commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: auth
type: Opaque
stringData:
  admin-password: "REPLACE_WITH_KEYCLOAK_ADMIN_PASSWORD"
