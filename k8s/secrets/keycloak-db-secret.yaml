# Keycloak RDS database password.
# Referenced by bitnami/keycloak Helm chart via externalDatabase.existingSecret.
# Replace placeholder value before applying. Do NOT commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: auth
type: Opaque
stringData:
  db-password: "REPLACE_WITH_KEYCLOAK_DB_PASSWORD"
