# AWS SES email configuration for session summary emails.
# Replace placeholder values before applying. Do NOT commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: ses-config
  namespace: claude-simulator
type: Opaque
stringData:
  sender-email: "REPLACE_WITH_VERIFIED_SES_EMAIL"   # Must be verified in SES
  aws-region: "us-east-1"                            # SES region
